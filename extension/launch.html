<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting Subtle</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --fg: #15181d; --muted: #5b6370; --accent: #1f9e75; --line: #e3e6eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101317; --card: #181c22; --fg: #e9ecf0; --muted: #9aa3ae; --accent: #2fbf8f; --line: #2a3038; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; }
  h1 { font-size: 19px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 28px; height: 28px; }
  p { margin: 8px 0 0; color: var(--muted); }
  .ok { color: var(--accent); }
  button { margin-top: 16px; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font: inherit; font-size: 13.5px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1><img src="icons/icon48.png" alt="">Starting Subtle…</h1>
    <p id="msg">If your browser asks whether to open Subtle, choose <b>Open</b> (tick <i>Always allow</i> to skip this next time).</p>
    <button id="again">Try again</button>
  </div>
<script src="launch.js"></script>
</body>
</html>
